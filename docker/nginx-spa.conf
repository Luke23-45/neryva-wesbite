# Neryva website static server.
#
# TanStack Router owns client-side routes, so every non-file path falls
# back to index.html. Vite emits hashed filenames under /assets/, which
# are safe for long immutable caching.
#
# CSP is deliberately NOT baked here: the correct policy depends on the
# deployment's engine origin and widget-embed posture, so it belongs at
# the edge/host (see DEPLOY.md), not in this portable image.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static-asset posture mirrors the engine API hardening (ENG-006):
    # no framing of the console, no MIME sniffing.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets — immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: real files first (index.html, favicon, public/*),
    # then hand client-side routes to the router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

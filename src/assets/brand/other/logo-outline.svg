<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
    <!--
        Neryva Logo — Outline Variant
        Background: None (fully transparent)
        Fill: none on all shapes
        Stroke: #a855f7 (brand amethyst), 4px — scaled to viewBox units (14px at 1000px canvas)
        Use on: Watermarks, embossed prints, laser engravings, technical docs
    -->
    <defs>
        <g id="masterWing">
            <!-- Stroke weight: 14 units = ~4px at typical render sizes -->
            <polygon
                points="45, -280 340, -420 430, -420 260, -190 55, -95"
                fill="none"
                stroke="#a855f7"
                stroke-width="14"
                stroke-linejoin="round"
            />
            <polygon
                points="26, -70 460, -110 450, -35 175, 115 20, 25"
                fill="none"
                stroke="#a855f7"
                stroke-width="14"
                stroke-linejoin="round"
            />
            <polygon
                points="14, 55 310, 240 245, 305 55, 395 14, 325"
                fill="none"
                stroke="#a855f7"
                stroke-width="14"
                stroke-linejoin="round"
            />
        </g>
    </defs>

    <g transform="translate(500, 500)">
        <use href="#masterWing" transform="scale(-1, 1)" />
        <use href="#masterWing" />
        <polygon
            points="0,-440 30,-290 30,-115 0,45 -30,-115 -30,-290"
            fill="none"
            stroke="#a855f7"
            stroke-width="14"
            stroke-linejoin="round"
        />
    </g>
</svg>

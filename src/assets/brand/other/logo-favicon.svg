<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
    <!--
        Neryva Logo — Favicon / Small-Size Variant
        ViewBox: 32×32 (native favicon scale)
        Design: Simplified — central obelisk + one merged wing shard per side
        Background: #0a0a0f (dark, required so it reads clearly at 16×16 / 32×32)
        Colors: High-contrast brand colors only — lilac wing, teal middle, bright obelisk tip
        Use on: browser favicon (favicon.svg), PWA manifest icon, tab icon
    -->
    <defs>
        <!-- Simplified single gradient per side for favicon legibility -->
        <linearGradient id="fvUpper" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#c084fc" />
            <stop offset="100%" stop-color="#6366f1" />
        </linearGradient>
        <linearGradient id="fvMiddle" x1="0%" y1="50%" x2="100%" y2="50%">
            <stop offset="0%" stop-color="#05e3a4" />
            <stop offset="100%" stop-color="#00ff87" />
        </linearGradient>
        <linearGradient id="fvObelisk" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="100%" stop-color="#a855f7" />
        </linearGradient>
    </defs>

    <!-- Dark background for favicon contrast -->
    <rect width="32" height="32" rx="6" fill="#0a0a0f" />

    <!-- Centered at 16,18 — slightly above center for visual balance -->
    <g transform="translate(16, 18)">
        <!-- RIGHT: Upper wing shard (simplified) -->
        <polygon points="1.5,-9 11,-14 14,-14 8,-6 2,-3"    fill="url(#fvUpper)" />
        <!-- RIGHT: Middle wing shard (simplified) -->
        <polygon points="1,-2 15,-4 14.5,-1 5.5,4 0.5,1"   fill="url(#fvMiddle)" />

        <!-- LEFT: Mirrored upper -->
        <polygon points="-1.5,-9 -11,-14 -14,-14 -8,-6 -2,-3"  fill="url(#fvUpper)" />
        <!-- LEFT: Mirrored middle -->
        <polygon points="-1,-2 -15,-4 -14.5,-1 -5.5,4 -0.5,1" fill="url(#fvMiddle)" />

        <!-- Central Obelisk -->
        <polygon points="0,-14 1,-9 1,-3.5 0,1.5 -1,-3.5 -1,-9" fill="url(#fvObelisk)" />
    </g>
</svg>

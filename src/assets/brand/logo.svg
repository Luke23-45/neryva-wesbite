<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
    <!-- Ambient Backdrop: Dark Vignette to make colors pop -->
    <defs>
        <!-- Background Radial Gradient -->
        <radialGradient id="ambientBackground" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="#12131c" />
            <stop offset="100%" stop-color="#050507" />
        </radialGradient>

        <!-- Gradients with enriched mid-stops for smoother transitions -->
        <!-- Upper Wing: Lilac to Indigo -->
        <linearGradient id="twindigoUpper" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#c084fc" />
            <stop offset="50%" stop-color="#818cf8" />
            <stop offset="100%" stop-color="#6366f1" />
        </linearGradient>

        <!-- Middle Wing: Emerald to Teal -->
        <linearGradient id="twindigoMiddle" x1="0%" y1="50%" x2="100%" y2="50%">
            <stop offset="0%" stop-color="#00a8cc" />
            <stop offset="60%" stop-color="#05e3a4" />
            <stop offset="100%" stop-color="#00ff87" />
        </linearGradient>

        <!-- Lower Wing: Azure to Midnight -->
        <linearGradient id="twindigoLower" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0284c7" />
            <stop offset="50%" stop-color="#2563eb" />
            <stop offset="100%" stop-color="#1e1b4b" />
        </linearGradient>

        <!-- Central Obelisk: Harmonious Amethyst -->
        <linearGradient id="twindigoObelisk" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%" stop-color="#faf5ff" />
            <stop offset="50%" stop-color="#a855f7" />
            <stop offset="100%" stop-color="#2e0854" />
        </linearGradient>

        <!-- MASTER WING TEMPLATE (Saves space and keeps code clean) -->
        <g id="masterWing">
             <!-- UPPER SOARING APEX SHARD -->
             <polygon points="45, -280 340, -420 430, -420 260, -190 55, -95" fill="url(#twindigoUpper)" />

             <!-- MIDDLE CORE STABILITY ANCHOR CHASM -->
             <polygon points="26, -70 460, -110 450, -35 175, 115 20, 25" fill="url(#twindigoMiddle)" />

             <!-- LOWER TERMINATION JAW FLOW STRIKE -->
             <polygon points="14, 55 310, 240 245, 305 55, 395 14, 325" fill="url(#twindigoLower)" />
        </g>
    </defs>

    <!-- Rendered Background -->
    <rect width="100%" height="100%" fill="url(#ambientBackground)" />

    <!-- Centered Logo Layout Group -->
    <g transform="translate(500, 500)">
        
        <!-- LEFT HEMISPHERE (Mirrored) -->
        <use href="#masterWing" transform="scale(-1, 1)" />

        <!-- RIGHT HEMISPHERE -->
        <use href="#masterWing" />
        
        <!-- THE RUNIC CENTER SINGULARITY OBELISK AXIS -->
        <polygon points="
            0, -440
            30, -290
            30, -115
            0, 45
            -30, -115
            -30, -290
        " fill="url(#twindigoObelisk)" />

    </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none" aria-hidden="true">
  <style>
    @keyframes pulse { 0%,100%{opacity:0.45} 50%{opacity:1} }
    @keyframes dash { to { stroke-dashoffset: -40 } }
    .node { fill: #D8DEE3; }
    .node-accent { fill: #0B7F79; animation: pulse 3s ease-in-out infinite; }
    .node-blue { fill: #2458D3; animation: pulse 3s ease-in-out infinite 0.5s; }
    .line { stroke: #D8DEE3; stroke-width: 1; }
    .path-active { stroke: #0B7F79; stroke-width: 1.5; stroke-dasharray: 8 4; animation: dash 2s linear infinite; }
  </style>

  <!-- Grid lines horizontal -->
  <line x1="40" y1="40" x2="360" y2="40" class="line"/>
  <line x1="40" y1="80" x2="360" y2="80" class="line"/>
  <line x1="40" y1="120" x2="360" y2="120" class="line"/>
  <line x1="40" y1="160" x2="360" y2="160" class="line"/>

  <!-- Grid lines vertical -->
  <line x1="40" y1="20" x2="40" y2="180" class="line"/>
  <line x1="80" y1="20" x2="80" y2="180" class="line"/>
  <line x1="120" y1="20" x2="120" y2="180" class="line"/>
  <line x1="160" y1="20" x2="160" y2="180" class="line"/>
  <line x1="200" y1="20" x2="200" y2="180" class="line"/>
  <line x1="240" y1="20" x2="240" y2="180" class="line"/>
  <line x1="280" y1="20" x2="280" y2="180" class="line"/>
  <line x1="320" y1="20" x2="320" y2="180" class="line"/>
  <line x1="360" y1="20" x2="360" y2="180" class="line"/>

  <!-- Active routing path -->
  <path d="M40,80 L120,80 L120,120 L200,120 L200,80 L280,80" class="path-active"/>
  <path d="M40,120 L80,120 L80,160 L160,160 L160,120 L240,120" class="path-active" style="animation-delay: 1s"/>

  <!-- Nodes - grid intersections -->
  <circle cx="40" cy="40" r="3" class="node"/>
  <circle cx="80" cy="40" r="3" class="node"/>
  <circle cx="120" cy="40" r="3" class="node"/>
  <circle cx="160" cy="40" r="3" class="node"/>
  <circle cx="200" cy="40" r="3" class="node"/>
  <circle cx="240" cy="40" r="3" class="node"/>
  <circle cx="280" cy="40" r="3" class="node"/>
  <circle cx="320" cy="40" r="3" class="node"/>
  <circle cx="360" cy="40" r="3" class="node"/>

  <circle cx="40" cy="80" r="3" class="node"/>
  <circle cx="80" cy="80" r="3" class="node"/>
  <circle cx="120" cy="80" r="4" class="node-accent"/>
  <circle cx="160" cy="80" r="3" class="node"/>
  <circle cx="200" cy="80" r="3" class="node"/>
  <circle cx="240" cy="80" r="3" class="node"/>
  <circle cx="280" cy="80" r="4" class="node-blue"/>
  <circle cx="320" cy="80" r="3" class="node"/>
  <circle cx="360" cy="80" r="3" class="node"/>

  <circle cx="40" cy="120" r="3" class="node"/>
  <circle cx="80" cy="120" r="4" class="node-blue"/>
  <circle cx="120" cy="120" r="3" class="node"/>
  <circle cx="160" cy="120" r="3" class="node"/>
  <circle cx="200" cy="120" r="4" class="node-accent"/>
  <circle cx="240" cy="120" r="3" class="node"/>
  <circle cx="280" cy="120" r="3" class="node"/>
  <circle cx="320" cy="120" r="3" class="node"/>
  <circle cx="360" cy="120" r="3" class="node"/>

  <circle cx="40" cy="160" r="3" class="node"/>
  <circle cx="80" cy="160" r="3" class="node"/>
  <circle cx="120" cy="160" r="3" class="node"/>
  <circle cx="160" cy="160" r="4" class="node-accent"/>
  <circle cx="200" cy="160" r="3" class="node"/>
  <circle cx="240" cy="160" r="3" class="node"/>
  <circle cx="280" cy="160" r="3" class="node"/>
  <circle cx="320" cy="160" r="3" class="node"/>
  <circle cx="360" cy="160" r="3" class="node"/>
</svg>

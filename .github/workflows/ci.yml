# WEB-006 — website CI gate.
#
# Gates every push to the working branch and every pull request on:
#   1. `npm ci`              — dependency install from the lockfile
#   2. `npm run build`       — `tsc -b && vite build` (typecheck + production bundle)
#      `npm run check:bundle` — bundle-size budget gate (scripts/check-bundle-budget.mjs);
#                               fails the build if total JS or the largest chunk
#                               exceeds budget. Budgets live in the script header.
#   3. `npm run test`        — `vitest run` (full unit suite, non-watch)
#
# All three jobs are REQUIRED: no `continue-on-error`, so a red gate
# blocks the branch. This gate exists so website defects (e.g. the
# design-token drift that broke `npm run build`) cannot land again.
#
# Pin: `push` covers `backend-integration` (the active console branch)
# and `main` (the merge target, see WEB-008/WEB-010).
name: ci

on:
  push:
    branches: [main, backend-integration]
  pull_request:

jobs:
  install:
    name: npm ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

  build:
    name: npm run build
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Bundle-size budget gate (remediation 4.6): fails if the production
      # JS in dist/ exceeds the budgets in scripts/check-bundle-budget.mjs.
      - run: npm run check:bundle

  test:
    name: vitest run
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # GitHub-hosted ubuntu runners ship 16 GB RAM; the vitest suite
      # needs it (jsdom-heavy, ~111 files).
      - run: npm run test
